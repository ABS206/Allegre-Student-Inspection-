<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Allegre Instructor Inspection Dashboard</title><style>body{font:16px system-ui,sans-serif;background:#f4f5f7;color:#20252b;margin:0}header{background:#8b1538;color:white;padding:20px}main{max-width:1100px;margin:auto;padding:20px}section{background:white;padding:18px;margin:15px 0;border-radius:10px;border:1px solid #ddd}input,button{font:inherit;padding:10px;margin:5px}button{background:#8b1538;color:white;border:0;border-radius:6px;cursor:pointer}table{border-collapse:collapse;width:100%}th,td{border-bottom:1px solid #ddd;text-align:left;padding:10px}tr{vertical-align:top}.scroll{overflow:auto}.muted{color:#52616c}details{margin:8px 0}#dashboard{display:none}</style></head><body><header><h1>Allegre | Instructor Inspection Dashboard</h1><p>Ball State University · Live student submissions</p></header><main><section id="login"><h2>Instructor sign in</h2><p>Use the Firebase Email/Password instructor account authorized in Firestore rules.</p><input id="email" type="email" placeholder="Instructor email" autocomplete="username"><input id="password" type="password" placeholder="Password" autocomplete="current-password"><button id="signin">Sign in</button><p id="authMsg" role="status"></p></section><section id="dashboard"><h2>Live inspections</h2><p id="status">Connecting…</p><p id="counts"></p><button id="export">Export all inspections CSV</button><button id="signout">Sign out</button><div class="scroll"><table><thead><tr><th>Submitted</th><th>Student</th><th>Inspection date</th><th>Service period</th><th>Results</th></tr></thead><tbody id="rows"></tbody></table></div></section></main>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script><script src="allegre-firebase-config.js"></script><script>
'use strict';const $=id=>document.getElementById(id);let unsub=null,records=[];function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function csv(rows,cols){const q=x=>'"'+String(x??'').replace(/"/g,'""')+'"';return [cols.map(q).join(','),...rows.map(r=>cols.map(c=>q(r[c])).join(','))].join('\r\n')}function download(body){const u=URL.createObjectURL(new Blob([body],{type:'text/csv'}));const a=document.createElement('a');a.href=u;a.download='Allegre-instructor-inspections.csv';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
let firebaseReady=false;try{if(typeof firebase==='undefined')throw Error('Firebase SDK did not load. Check your internet connection.');if(!window.ALLEGRE_FIREBASE_CONFIG||!window.ALLEGRE_FIREBASE_CONFIG.apiKey||window.ALLEGRE_FIREBASE_CONFIG.apiKey==='REPLACE_ME')throw Error('Firebase configuration missing. Check allegre-firebase-config.js.');if(!firebase.apps.length)firebase.initializeApp(window.ALLEGRE_FIREBASE_CONFIG);firebaseReady=true;$('authMsg').textContent='Firebase connected. Sign in with your instructor account.'}catch(e){$('authMsg').textContent='Firebase setup error: '+e.message}
$('signin').onclick=async()=>{if(!firebaseReady){$('authMsg').textContent='Firebase is not initialized. Check the configuration file and refresh.';return}try{await firebase.auth().signInWithEmailAndPassword($('email').value,$('password').value);$('password').value=''}catch(e){$('authMsg').textContent=e.message}};
$('signout').onclick=()=>firebase.auth().signOut();
if(firebaseReady)firebase.auth().onAuthStateChanged(user=>{if(unsub){unsub();unsub=null}records=[];$('login').style.display=user?'none':'block';$('dashboard').style.display=user?'block':'none';if(!user)return;$('status').textContent='Listening for student submissions…';unsub=firebase.firestore().collection('allegreStudentInspections').onSnapshot(s=>{records=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>String(b.submittedAt).localeCompare(String(a.submittedAt)));$('counts').textContent=records.length+' inspections · '+records.reduce((n,r)=>n+r.results.filter(x=>x.result==='Needs attention').length,0)+' checkpoints needing attention';$('rows').innerHTML=records.map(r=>{const issues=r.results.filter(x=>x.result==='Needs attention');return '<tr><td>'+escapeHtml(r.submittedAt)+'</td><td>'+escapeHtml(r.inspector)+'</td><td>'+escapeHtml(r.date)+'</td><td>'+escapeHtml(r.shift)+'</td><td>'+escapeHtml(r.results.length)+' reviewed · '+issues.length+' need attention<details><summary>View inspection</summary>'+r.results.map(x=>'<p><b>'+escapeHtml(x.area)+'</b>: '+escapeHtml(x.checkpoint)+' — '+escapeHtml(x.result)+(x.note?' ('+escapeHtml(x.note)+')':'')+'</p>').join('')+'</details></td></tr>'}).join('');$('status').textContent='Live · Updated automatically'},e=>$('status').textContent='Access error: '+e.message)});
$('export').onclick=()=>{const rows=records.flatMap(r=>(r.results||[]).map(x=>({id:r.id,submittedAt:r.submittedAt,inspector:r.inspector,date:r.date,shift:r.shift,...x})));download(csv(rows,['id','submittedAt','inspector','date','shift','area','checkpoint','result','note']))};
</script></body></html>
